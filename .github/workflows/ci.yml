name: Bare tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm rebuild bare-runtime --ignore-scripts
      - run: npm run lint:js
      - run: npm test
      - run: npm run test:node
      - run: npm run pack
      - name: Install packed production dependencies
        run: >-
          node -e "const p = require('./package.json');
          require('child_process').execSync('npm install --prefix out/consumer --omit=dev --ignore-scripts ./'+p.name+'-'+p.version+'.tgz', {stdio: 'inherit'})"
      - name: Check installed package
        run: >-
          npm exec -- bare --eval
          "require('./out/consumer/node_modules/pear-vanity-gpu')('', 'touch', undefined, { workers: 1 }).then(pair => { if (pair.publicKey.length !== 32) throw new Error('Invalid public key') }).catch(err => { console.error(err); Bare.exitCode = 1 })"
      # Outside the repository, so the repo's bare-runtime dev dependency is not found.
      - name: Node.js without Bare reports how to install it
        shell: bash
        run: |
          consumer="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/node-consumer"
          mkdir -p "$consumer"
          cp ./*.tgz "$consumer/"
          cd "$consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund ./pear-vanity-gpu-*.tgz
          node -e "require('pear-vanity-gpu')('').then(() => process.exit(1), err => { if (err.code !== 'ERR_BARE_NOT_FOUND') throw err; console.log(err.message) })"
      - name: Node.js uses an installed Bare runtime
        shell: bash
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/node-consumer"
          npm install --no-audit --no-fund bare-runtime@1.36.0
          node -e "require('pear-vanity-gpu')('', 'touch', undefined, { workers: 1 }).then(pair => { if (pair.secretKey.length !== 64) throw new Error('Invalid secret key') })"
          npx --no-install pear-vanity-gpu p --backend cpu --workers 1 --json > key.json
          node -e "const k = require('./key.json'); if (!k.key.startsWith('p') || k.secretKey.length !== 128) throw new Error('Invalid command output')"
